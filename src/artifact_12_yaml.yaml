version: '3.8'

services:
  segmento-growth-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: segmento-growth-daemon
    restart: always
    environment:
      - NODE_ENV=production
      - SOLANA_RPC_URL=${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
      - PROGRAM_ID=${PROGRAM_ID:-SegM111111111111111111111111111111111111111}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - ORACLE_SECRET_SEED=${ORACLE_SECRET_SEED}
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"