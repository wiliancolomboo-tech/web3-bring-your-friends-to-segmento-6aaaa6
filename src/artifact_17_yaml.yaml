version: '3.8'

services:
  segmento-referral-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - PROGRAM_ID=SegRefer11111111111111111111111111111111111
      - SLACK_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - RESEND_API_KEY=re_123456789
      - ADMIN_KEYPAIR_PATH=/secrets/admin-keypair.json
    volumes:
      - ./secrets:/secrets:ro
    ports:
      - "8080:8080"