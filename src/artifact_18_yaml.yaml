version: "3.8"

services:
  segmento-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: segmento_sync_daemon
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - SOLANA_WS_URL=wss://api.devnet.solana.com
      - PROGRAM_ID=SegmXzB8q9WJtK3vY1qQn8g5mH3z8J2XqYn9g5mH3z8
      - RESEND_API_KEY=re_test_000000000000000000000000
      - NOTIFICATION_TARGET_EMAIL=ops@segmento.network
      - DISCORD_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"