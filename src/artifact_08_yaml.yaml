version: "3.8"

services:
  segmento-growth-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: segmento-growth-daemon
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - SOLANA_WS_URL=wss://api.devnet.solana.com
      - PROGRAM_ID=SegmXzBcxL4X6N3Zq7Q8m7Lq9uK8yT5W4vB3xM2j9Np
      - RESEND_API_KEY=re_test_000000000000000000000000
      - DISCORD_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - FROM_EMAIL=referrals@segmento.app
      - APP_BASE_URL=https://segmento.app
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"