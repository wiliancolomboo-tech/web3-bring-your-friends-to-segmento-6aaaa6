version: "3.8"

services:
  segmento-growth-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: segmento-referral-worker
    restart: always
    environment:
      - PORT=8080
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - SOLANA_WS_URL=wss://api.devnet.solana.com
      - PROGRAM_ID=SegReferraL111111111111111111111111111111111
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SEGMENTO_ADMIN_EMAIL=growth@segmento.io
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
    ports:
      - "8080:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"