[package]
name = "segmento-referral"
version = "0.1.0"
description = "Production-grade on-chain referral and growth attribution engine for Segmento"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "segmento_referral"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token", "mint"] }